{% include 'encabezado.html' %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-secondary text-light shadow-lg border-warning">
            <div class="card-header bg-black text-warning border-warning">
                <h4 class="mb-0">✏️ Editar Componente</h4>
            </div>
            <div class="card-body">

                {% if mensaje %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        ⚠️ {{ mensaje }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}

                <form action="/actualizar" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="idProducto" value="{{ producto._id }}">

                    <div class="mb-3">
                        <label class="form-label">Código del Componente:</label>
                        <input type="number" name="txtCodigo" class="form-control bg-dark text-light border-secondary" value="{{ producto.codigo }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del Componente:</label>
                        <input type="text" name="txtNombre" class="form-control bg-dark text-light border-secondary" value="{{ producto.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría:</label>
                        <select name="cbCategoria" class="form-select bg-dark text-light border-secondary" required>
                            <option value="Procesadores" {% if producto.categoria == 'Procesadores' %}selected{% endif %}>Procesadores (CPU)</option>
                            <option value="Tarjetas de Video" {% if producto.categoria == 'Tarjetas de Video' %}selected{% endif %}>Tarjetas de Video (GPU)</option>
                            <option value="Memorias RAM" {% if producto.categoria == 'Memorias RAM' %}selected{% endif %}>Memorias RAM</option>
                            <option value="Almacenamiento" {% if producto.categoria == 'Almacenamiento' %}selected{% endif %}>Almacenamiento (SSD / HDD)</option>
                            <option value="Tarjetas Madre" {% if producto.categoria == 'Tarjetas Madre' %}selected{% endif %}>Tarjetas Madre (Motherboard)</option>
                            <option value="Fuentes de Poder" {% if producto.categoria == 'Fuentes de Poder' %}selected{% endif %}>Fuentes de Poder (PSU)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" name="txtPrecio" class="form-control bg-dark text-light border-secondary" value="{{ producto.precio }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Actualizar Foto (Opcional):</label>
                        <input type="file" name="fileFoto" class="form-control bg-dark text-light border-secondary" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-light">⬅️ Cancelar</a>
                        <button type="submit" class="btn btn-warning fw-bold">🔄 Actualizar Componente</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
