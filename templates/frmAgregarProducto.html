{% include 'encabezado.html' %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card bg-secondary text-light shadow-lg border-info">
            <div class="card-header bg-black text-info border-info">
                <h4 class="mb-0">➕ Registrar Nuevo Componente</h4>
            </div>
            <div class="card-body">

                {% if mensaje %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        ⚠️ {{ mensaje }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}

                <form action="/agregarProducto" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Código del Componente:</label>
                        <input type="number" name="txtCodigo" class="form-control bg-dark text-light border-secondary" value="{{ producto.codigo if producto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del Componente:</label>
                        <input type="text" name="txtNombre" class="form-control bg-dark text-light border-secondary" placeholder="Ej: Procesador Intel i7 13700K" value="{{ producto.nombre if producto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría:</label>
                        <select name="cbCategoria" class="form-select bg-dark text-light border-secondary" required>
                            <option value="">Seleccione una categoría...</option>
                            <option value="Procesadores" {% if producto and producto.categoria == 'Procesadores' %}selected{% endif %}>Procesadores (CPU)</option>
                            <option value="Tarjetas de Video" {% if producto and producto.categoria == 'Tarjetas de Video' %}selected{% endif %}>Tarjetas de Video (GPU)</option>
                            <option value="Memorias RAM" {% if producto and producto.categoria == 'Memorias RAM' %}selected{% endif %}>Memorias RAM</option>
                            <option value="Almacenamiento" {% if producto and producto.categoria == 'Almacenamiento' %}selected{% endif %}>Almacenamiento (SSD / HDD)</option>
                            <option value="Tarjetas Madre" {% if producto and producto.categoria == 'Tarjetas Madre' %}selected{% endif %}>Tarjetas Madre (Motherboard)</option>
                            <option value="Fuentes de Poder" {% if producto and producto.categoria == 'Fuentes de Poder' %}selected{% endif %}>Fuentes de Poder (PSU)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" name="txtPrecio" class="form-control bg-dark text-light border-secondary" value="{{ producto.precio if producto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Foto del Componente:</label>
                        <input type="file" name="fileFoto" class="form-control bg-dark text-light border-secondary" accept="image/*">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-outline-light">⬅️ Cancelar</a>
                        <button type="submit" class="btn btn-info fw-bold">💾 Guardar Componente</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
